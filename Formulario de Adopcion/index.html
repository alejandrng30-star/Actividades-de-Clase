<!DOCTYPE html>
    <html>
        <head>
   
            <title>Document</title>
        
            <link rel="stylesheet" href="style.css" />
        
        </head>
        
        <body>
                    <center>
            <h1 id="titulo">Formulario de Adopcion</h1>
               <h2 id="subtitulo">Por favor, completa los campos</h2>
                <table id="tabla">
                   <tr>
                       <td>Nombre y Apellido</td>
                       <td><input type="text" name="nombre" /></td>
                    </tr>
                    <tr>
                       <td>
                        <label for="nacimiento">Fecha de Nacimiento</label>
                       <input 
                        type="date"
                        id="nacimiento"
                        name="nacimiento"
                        value="2000-06-30"
                        min="1960-01-01"
                        max="2015-12-31"/></td>
                    </tr>
                    <tr>
                       <td>Genero del Solicitante</td>
                       <td>
                           <input type="radio" id="masculino" name="genero" value="masculino" checked />
                           <label for="masculino">Masculino</label>
                           <input type="radio" id="femenino" name="genero" value="femenino" />
                           <label for="femenino">Femenino</label>
                       </td>
                    </tr>
                    <tr>
                       <td>Numero de Telefono</td>
                       <td><input type="text" name="telefono" /></td>
                    </tr>
                    <tr>
                       <td>Correo Electronico</td>
                       <td><input type="text" name="correo" /></td>
                    </tr>
                    <tr>
                        <td>Tipo de animal que ha tenido</td>
                        <td>
                           <form action="/action_page.php">
                            <select name="animales" id="animales">
                                <option value="perro">Perro</option>
                                <option value="gato">Gato</option>
                                <option value="conejo">Roedor</option>
                                <option value="hamster">Ave</option>
                                <option value="pez">Pez</option>
                                <option value="reptil">Reptil</option>
                                <option value="otro">Otro</option>
                            </select>
                            </form>
                        </td> 
                    </tr>
                    <tr>
                       <td>Especie que se quiere Adoptar</td>
                       <td>
                           <input type="radio" id="perro" name="especie" value="perro" checked />
                           <label for="perro">Canino</label>
                           <input type="radio" id="felino" name="especie" value="felino" />
                           <label for="felino">Felino</label>
                       </td>
                    </tr>
                        <tr>
                       <td>Nombre del Animal en Adopcion</td>
                       <td><input type="text" name="nombre_animal" /></td>
                    </tr>
                                                </center>
                </table>
                    <button type="submit">Enviar</button>

                       <p>&copy; 2026 Todos los Derechos Reservados </p>
                    </center>
            </body>
    </html>
