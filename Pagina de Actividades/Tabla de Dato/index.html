<!DOCTYPE html> 
<html lang="es">

</head>
<body>

                <tr>

                </tr>
                <tr>
                    <td><img src="img/img3.jpeg" alt="Imagen 3" class="img-tabla"></td>
                    <td><a href="pdf/C27.JAVA.pdf" target="_blank" class="link-tabla">Documento 3</a></td>
                    <td><a href="video/vid3.mp4" target="_blank" class="link-tabla">Video 3</a></td>

            </tbody>
        </table>
    </div>

</html>
